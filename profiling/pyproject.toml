[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xgrammar-profile"
version = "0.1.0"
description = "Reproducible profiling harness for XGrammar v0.2.7"
requires-python = ">=3.10"
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
prepare = ["huggingface-hub>=0.20", "transformers>=4.38,<6"]
test = ["pytest>=7"]

[project.scripts]
xgrammar-profile = "xgrammar_profile.cli:main"

[tool.setuptools]
packages = ["xgrammar_profile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
